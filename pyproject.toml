[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-3090-exl3-bench"
version = "0.1.0"
description = "Zero-dependency local LLM inference benchmark harness for Dual RTX 3090 TabbyAPI (ExLlamaV3)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bench-exl3 = "bench_exl3.cli:main"

[tool.setuptools.packages.find]
include = ["bench_exl3*"]
